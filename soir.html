<!DOCTYPE html>
<html lang="fr">
 
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Boîte à Hypnose</title>
 
<style>
body {
margin: 0;
font-family: Arial, sans-serif;
background: linear-gradient(135deg, #16213e, #0f3460);
display: flex;
justify-content: center;
align-items: center;
min-height: 100vh;
}
 
.carte {
background: white;
width: 90%;
max-width: 500px;
padding: 40px;
border-radius: 25px;
text-align: center;
box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
}
 
.logo {
font-size: 60px;
}
 
h1 {
color: #16213e;
}
 
p {
color: #666;
}
 
.bouton {
display: inline-block;
padding: 18px 35px;
background: #6c63ff;
color: white;
border: none;
border-radius: 50px;
font-size: 22px;
font-weight: bold;
cursor: pointer;
margin-top: 20px;
}
 
.bouton:hover {
background: #5147d8;
}
</style>
 
</head>
 
<body>
 
<div class="carte">
 
<div class="logo">🌙</div>
 
<h1>Développer mes capacités</h1>
 
<p>Version du soir</p>
 
<iframe
width="100%"
height="300"
scrolling="no"
frameborder="no"
allow="autoplay"
src="https://w.soundcloud.com/player/?url=https%3A//api.soundcloud.com/tracks/soundcloud%3Atracks%w_teaser=false&visual=true
</iframe>
 
</div>
 
</div>
 
</body>
 
</html>
